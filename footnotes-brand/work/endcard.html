<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="base.css">
<style>
  html, body { width: 1080px; height: 1920px; overflow: hidden; }
  body {
    position: relative;
    background: var(--ink);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  svg.grain { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0.06; }

  .deco { position: absolute; color: var(--cream); font-family: 'Fraunces Brand'; opacity: 0.12; }
  .deco.rule { background: var(--cream); opacity: 0.12; height: 2px; }

  .icon {
    width: 340px; height: 340px; border-radius: 50%;
    background: var(--cream);
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 70px;
  }
  .icon svg { width: 72%; height: 72%; }

  .cta {
    font-family: 'Fraunces Brand';
    font-weight: 800;
    font-variation-settings: 'wght' 800, 'opsz' 100;
    font-size: 72px;
    color: var(--cream);
    text-align: center;
    line-height: 1.15;
    max-width: 820px;
  }
  .cta .accent { color: var(--mustard); }

  .sub {
    margin-top: 30px;
    font-family: 'Inter Brand';
    font-weight: 600;
    font-size: 28px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #cfc6b4;
  }
</style>
</head>
<body>
  <svg class="grain">
    <filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/></filter>
    <rect width="100%" height="100%" filter="url(#n)"/>
  </svg>

  <div class="deco" style="top:140px; left:120px; font-size:90px; transform: rotate(-8deg);">*</div>
  <div class="deco" style="top:170px; right:130px; font-size:70px; transform: rotate(10deg);">&dagger;</div>
  <div class="deco rule" style="top:260px; left:50%; width:260px; margin-left:-130px;"></div>
  <div class="deco" style="bottom:160px; left:140px; font-size:70px;">&sup1;</div>
  <div class="deco" style="bottom:150px; right:150px; font-size:70px; transform: rotate(6deg);">&sup2;</div>

  <div class="icon">
    <svg viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
      <text x="320" y="545" text-anchor="middle" font-size="480" font-weight="900" font-family="'Fraunces Brand'" font-variation-settings="'wght' 900, 'opsz' 144" fill="#1E1A16">F</text>
      <text x="548" y="300" text-anchor="middle" font-size="205" font-weight="800" font-family="'Fraunces Brand'" font-variation-settings="'wght' 800, 'opsz' 72" fill="#F2B33D">1</text>
    </svg>
  </div>

  <div class="cta">Follow for more<br><span class="accent">footnotes</span></div>
  <div class="sub">New shorts every week</div>
</body>
</html>
